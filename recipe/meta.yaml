{% set name = "djlint" %}
{% set version = "1.51.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/djlint-{{ version }}.tar.gz
  sha256: 8761b2ee8e956a135c292d197b651080a76e2e90d802e25297cf06abf16f176f

build:
  entry_points:
    - djlint = djlint._cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - typing_extensions >=4.4.0
    - click >=8.2.0
    - cssbeautifier >=1.13.0
    - jsbeautifier >=1.13.0
    - json5 >=0.10.0
    - pathspec >=0.9.0
    - pyyaml >=5.1
    - regex >=2020.10.22

test:
  imports:
    - djlint
  commands:
    - pip check
    - djlint --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/djlint/djLint
  summary: HTML template linter and formatter (Django, Jinja, Twig, Nunjucks, Handlebars, Mustache, Liquid, Go templates, Angular, Tera, Askama, Mako)
  doc_url: https://djlint.com
  dev_url: https://github.com/djlint/djLint
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
